name: Sync trainee profiles

# Pulls approved trainee profiles (and headshots) from the intake Google Sheet,
# commits any changes to main, and Vercel redeploys. Runs nightly and on demand
# (Actions tab > "Sync trainee profiles" > Run workflow). See docs/TRAINEES.md.

on:
  schedule:
    - cron: "23 10 * * *" # daily, ~3:23am Pacific (10:23 UTC)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow removing more than half of the published profiles at once"
        type: boolean
        default: false
      preview_branch:
        description: "Leave blank to publish to the live site. Or name a branch (e.g. trainee-preview) to get a Vercel preview without touching main."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-trainees
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Check transform logic
        run: npm run test:trainees

      - name: Sync from Google Sheet
        run: npm run sync:trainees
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TRAINEE_SHEET_ID: ${{ secrets.TRAINEE_SHEET_ID }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}

      - name: Commit changes
        run: |
          git add app/data/trainees.json app/data/trainees-meta.json scripts/trainees/slug-registry.json public/images/trainees
          if git diff --cached --quiet; then
            echo "No trainee changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync trainee profiles from intake form"
          if [ -n "$PREVIEW_BRANCH" ]; then
            case "$PREVIEW_BRANCH" in main|master) echo "Use a branch other than main for previews."; exit 1;; esac
            git push --force origin "HEAD:refs/heads/$PREVIEW_BRANCH"
            echo "Pushed to $PREVIEW_BRANCH. Vercel will build a preview deployment for it."
          else
            git pull --rebase origin main
            git push origin HEAD:main
          fi
        env:
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
