name: Accessibility

# Automated WCAG 2.1 AA checks on every push and pull request to main.
# - test:contrast  — verifies solid-background design-token contrast (fast, no browser)
# - test:a11y      — pa11y-ci (axe + HTMLCS) across representative pages of every template
# Contrast over hero/banner imagery is verified manually (see ACCESSIBILITY.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly re-audit (Mondays 13:00 UTC) so content/dependency drift is caught
  # even without a code change.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Design-token contrast (WCAG AA)
        run: npm run test:contrast

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 2
          done

      - name: pa11y-ci (axe + HTMLCS, WCAG2AA)
        run: npm run test:a11y
